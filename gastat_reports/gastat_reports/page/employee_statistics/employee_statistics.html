<link rel="stylesheet" href="/assets/gastat_reports/css/gastat_reports.css">
<script src="/assets/gastat_reports/js/pages_common.js"></script>

<div class="gastat-page" id="gastat-emp-page">
	<!-- Hero Header -->
	<div class="gastat-header alt">
		<div class="brand">
			<div class="logo-holder">
				<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
			</div>
			<div class="head-text">
				<h1>تقرير إحصاءات الموظفين</h1>
				<p>Employee Statistics</p>
				<div class="loc">وزارة الصناعة والثروة المعدنية</div>
			</div>
		</div>
		<div class="date-badge">
			<strong id="emp-today-date">-</strong>
			<span id="emp-period-label">-</span>
		</div>
	</div>

	<!-- Filters -->
	<div class="gastat-filters">
		<div class="f-field">
			<label>الشهر / Month</label>
			<select id="emp-month"></select>
		</div>
		<div class="f-field">
			<label>السنة / Year</label>
			<select id="emp-year"></select>
		</div>
		<div class="f-field">
			<label>الشركة / Company</label>
			<select id="emp-company"></select>
		</div>
		<div class="f-actions">
			<button class="btn-gastat btn-primary-g" id="emp-generate">
				<svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
				توليد التقرير
			</button>
			<button class="btn-gastat btn-export-pdf" id="emp-pdf" disabled>
				<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 15H6v-2h2v2zm0-4H6V9h2v2zm4 4h-2v-2h2v2zm0-4h-2V9h2v2zm4 4h-2V9h2v6z"/></svg>
				تصدير PDF
			</button>
			<button class="btn-gastat btn-export-xls" id="emp-xls" disabled>
				<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 14H9.5l-1.5-2-1.5 2H4v-9h3v2h-1v4l1.5-2 1.5 2V9H7V7h5v9zm3-1.5h3v1.5h-4v-7h1.5l.5 5.5zM6 0h6l4 4H6z"/></svg>
				تصدير Excel
			</button>
		</div>
	</div>

	<!-- Loading -->
	<div class="gastat-loading no-print" id="emp-loading" style="display:none;">
		<div class="spinner"></div> جاري تحميل البيانات...
	</div>

	<!-- Summary Cards -->
	<div class="gastat-cards" id="emp-cards"></div>

	<!-- Charts -->
	<div class="gastat-charts" id="emp-charts"></div>

	<!-- Table -->
	<div class="gastat-table-wrap" id="emp-table"></div>

	<!-- Empty -->
	<div class="gastat-empty no-print" id="emp-empty" style="display:none;">
		<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4-3h2v13h-2z"/></svg>
		<div>لا توجد بيانات</div>
		<div class="error-msg" id="emp-error"></div>
	</div>
</div>
